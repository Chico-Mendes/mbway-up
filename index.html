<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>MB WAY UP!</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <hgroup>
      <h1>MB WAY UP!</h1>
      <h2>Prémios Não Regulares</h2>
    </hgroup>

    <div class="date-pickers">
      <div>
        <label for="start-time">Início:</label>
        <input type="date" id="start-time" name="start-time" min="2021-09-22" />
      </div>
      <div>
        <label for="end-time">Fim:</label>
        <input type="date" id="end-time" name="end-time" min="2021-09-22" />
      </div>
    </div>

    <details class="accordion">
      <summary>Adicionar ao calendário</summary>
      <div class="cal-grid">
        <button>Próximo Diário</button>
        <button>Próximo Semanal</button>
        <button>Próximo Mensal</button>
        <button>Todos Diários</button>
        <button>Todos Semanais</button>
        <button>Todos Mensais</button>
        <button style="grid-column: 2">Todos</button>
      </div>
    </details>

    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Dia</th>
          <th>Hora</th>
          <th>Valor</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </body>

  <script src="utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const start = document.getElementById("start-time");
      const end = document.getElementById("end-time");

      // Event listeners
      start.addEventListener("change", populateTable);
      end.addEventListener("change", populateTable);

      const today = new Date();
      const next2Month = new Date(today);
      next2Month.setMonth(today.getMonth() + 2);

      start.valueAsDate = today;
      end.valueAsDate = next2Month;

      populateTable();
    });

    function populateTable() {
      const startDate = new Date(document.getElementById("start-time").value);
      const endDate = new Date(document.getElementById("end-time").value);
      endDate.setHours(23, 59, 59, 999);

      const events = [
        ...getDailyOccurrences(startDate, endDate).map((d) => ({
          class: "daily",
          type: "Diário",
          date: d,
          value: "20",
        })),
        ...getWeeklyOccurrences(startDate, endDate).map((d) => ({
          class: "weekly",
          type: "Semanal",
          date: d,
          value: "100",
        })),
        ...getMonthlyOccurrences(startDate, endDate).map((d) => ({
          class: "monthly",
          type: "Mensal",
          date: d,
          value: "200",
        })),
      ].sort((a, b) => a.date - b.date);

      const tbody = document.getElementById("table-body");

      tbody.innerHTML = "";

      const weekDays = ["D", "2", "3", "4", "5", "6", "S"];

      events.forEach((e) => {
        const row = document.createElement("tr");
        ((row.className = e.class),
          (row.innerHTML = `
          <td>${e.type}</td>
          <td>${e.date.toLocaleDateString("pt-PT")} - ${weekDays[e.date.getDay()]}</td>
          <td>${e.date.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit", hour12: false })}</td>
          <td>${e.value}</td>
        `));
        tbody.appendChild(row);
      });
    }
  </script>
</html>
